    <linearGradient id="petal" x2="0.2" y2="1"><stop stop-color="#fff0cf"/><stop offset=".6" stop-color="#ffd59f"/><stop offset="1" stop-color="#df9893"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
